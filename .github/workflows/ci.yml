name: CI

on:
  push:
    branches: [ main, prod-nightly, prod-stable ]
  pull_request:
    branches: [ main, prod-nightly, prod-stable ]

permissions:
  contents: read

jobs:
  test:
    name: Zig Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Verify Zig installation
        run: zig version

      - name: Run unit and conformance tests
        run: zig build test

      - name: Ensure no formatting regressions
        run: zig fmt --check .
