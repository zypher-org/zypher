name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.857+2b2b85c5f
      - run: zig build test --summary all
      - run: zig build test-io-clean
      - run: zig fmt --check .

  test-with-drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.857+2b2b85c5f
      - name: Install optional driver libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmysqlclient-dev libmongoc-dev libhiredis-dev
      - name: Run unit tests with all drivers enabled
        run: zig build test-unit -Ddb_postgres=true -Ddb_mysql=true -Ddb_mongodb=true -Ddb_redis=true --summary all
