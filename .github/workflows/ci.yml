name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.857+2b2b85c5f
      - run: zig build test --summary all
      - run: zig build test-io-clean
      - run: zig fmt --check .

  test-with-drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.857+2b2b85c5f
      - name: Run unit tests with all vendored drivers (musl)
        run: zig build test-unit -Ddb_mysql=true -Ddb_mongodb=true -Ddb_redis=true --summary all
      - name: Install libpq (not yet vendored)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Run unit tests with PostgreSQL (glibc)
        run: zig build test-unit -Dtarget=x86_64-native-gnu -Ddb_postgres=true --summary all
